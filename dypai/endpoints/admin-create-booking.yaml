name: admin-create-booking
method: POST
description: Admin creates a booking on behalf of a customer (source=admin).
allowed_roles:
  - admin
  - editor
trigger:
  http_api:
    auth_mode: jwt
input:
  type: object
  required:
    - service_id
    - starts_at
    - customer_name
    - customer_email
  properties:
    service_id:
      type: string
      format: uuid
    resource_id:
      type: string
      format: uuid
    starts_at:
      type: string
    customer_name:
      type: string
    customer_email:
      type: string
      format: email
    customer_phone:
      type: string
    party_size:
      type: integer
      minimum: 1
    notes:
      type: string
workflow:
  nodes:
    - id: handler
      type: javascript_code
      variable: result
      return: true
      env_vars: []
      input_data: {}
      timeout_ms: 15000
      code_file: code/admin_create_booking.js
