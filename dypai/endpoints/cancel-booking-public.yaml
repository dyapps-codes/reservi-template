name: cancel-booking-public
method: POST
description: Public cancellation via booking_code + cancel_token (sent in confirmation email).
trigger:
  http_api:
    auth_mode: public
input:
  type: object
  required:
    - booking_code
    - cancel_token
  properties:
    booking_code:
      type: string
    cancel_token:
      type: string
    reason:
      type: string
workflow:
  nodes:
    - id: handler
      type: javascript_code
      variable: result
      return: true
      env_vars: []
      input_data: {}
      timeout_ms: 5000
      code_file: code/cancel_booking_public.js
