name: admin-reschedule-booking
method: POST
description: Reschedule a booking to a new time / resource. Validates overlap and availability.
allowed_roles:
  - admin
  - editor
trigger:
  http_api:
    auth_mode: jwt
input:
  type: object
  required:
    - booking_id
    - starts_at
  properties:
    booking_id:
      type: string
      format: uuid
    starts_at:
      type: string
    resource_id:
      type: string
      format: uuid
    note:
      type: string
workflow:
  nodes:
    - id: handler
      type: javascript_code
      variable: result
      return: true
      env_vars: []
      input_data: {}
      timeout_ms: 10000
      code_file: code/admin_reschedule_booking.js
