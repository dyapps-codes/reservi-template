name: admin-save-settings
method: POST
description: Update the singleton business settings row.
allowed_roles:
  - admin
trigger:
  http_api:
    auth_mode: jwt
input:
  type: object
  properties:
    business_name:
      type: string
    tagline:
      type: string
    contact_email:
      type: string
      format: email
    contact_phone:
      type: string
    timezone:
      type: string
    locale:
      type: string
    currency:
      type: string
    booking_window_days:
      type: integer
      minimum: 1
    min_lead_minutes:
      type: integer
      minimum: 0
    cancellation_lead_minutes:
      type: integer
      minimum: 0
    slot_step_minutes:
      type: integer
    auto_confirm:
      type: boolean
    brand_color:
      type: string
    hero_image_url:
      type: string
    notifications_enabled:
      type: boolean
workflow:
  nodes:
    - id: handler
      type: javascript_code
      variable: result
      return: true
      env_vars: []
      input_data: {}
      timeout_ms: 5000
      code_file: code/admin_save_settings.js
